name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Manual button trigger enable karta hai

jobs:
  build-apk:
    name: Build Debug APK & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Run Android Unit Tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Android Debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify APK Output
        run: |
          echo "Listing generated APKs:"
          ls -la android/app/build/outputs/apk/debug/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LangFlow-AI-Keyboard-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
